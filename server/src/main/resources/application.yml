spring:
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_ID:123}
            client-secret: ${SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_SECRET:123}
            scope: 
              - openid
              - profile
              - email

app:
  oauth:
    default-password: ${APP_OAUTH_DEFAULT_PASSWORD:123}